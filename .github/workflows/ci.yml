name: NoxusLOB CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-engine:
    name: C++20 Engine Build & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure CMake
        run: cmake -B engine/build -S engine -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binaries
        run: cmake --build engine/build --config Release

      - name: Run Engine Test Suite
        run: ./engine/build/test_matching

      - name: Run Latency Benchmark
        run: ./engine/build/benchmarks 250000

  test-python-gateway:
    name: Python Gateway & Unit Tests
    runs-on: ubuntu-latest
    needs: build-and-test-engine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Build Engine Shared Library for FFI
        run: g++ -std=c++20 -O3 -shared -fPIC -I engine/include engine/src/OrderBook.cpp engine/src/C_API.cpp -o engine/libnoxus_engine.so

      - name: Run Gateway Unit Tests
        run: python server/tests/run_tests.py

  build-frontend:
    name: Web Trading Terminal Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Application
        working-directory: web
        run: npm run build
